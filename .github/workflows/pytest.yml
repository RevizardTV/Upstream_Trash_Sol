name: Python Backend CI / Pytest

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov httpx pymysql cryptography

      - name: Run Database Tests
        env:
          DB_USER: ${{ secrets.TIDB_USER }}
          DB_PASSWORD: ${{ secrets.TIDB_PASSWORD }}
          DB_HOST: ${{ secrets.TIDB_HOST }}
          DB_PORT: ${{ secrets.TIDB_PORT }}
          DB_NAME: ${{ secrets.TIDB_DATABASE }}
          REDIS_URL: redis://localhost:6379
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EM_RESET_KEY: ${{ secrets.EM_RESET_KEY }}
        run: |
          pytest tests/test_db.py -v

      - name: Run API & Integration Tests
        env:
          DB_USER: ${{ secrets.TIDB_USER }}
          DB_PASSWORD: ${{ secrets.TIDB_PASSWORD }}
          DB_HOST: ${{ secrets.TIDB_HOST }}
          DB_PORT: ${{ secrets.TIDB_PORT }}
          DB_NAME: ${{ secrets.TIDB_DATABASE }}
          REDIS_URL: redis://localhost:6379
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EM_RESET_KEY: ${{ secrets.EM_RESET_KEY }}
        run: |
          pytest