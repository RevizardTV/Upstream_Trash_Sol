[pytest]
minversion = 6.0
# Remove '-q' (quiet) and add '-v' (verbose) for file-by-file progress breakdown
addopts = -ra -v
testpaths = 
    tests
pythonpath = 
    .
    backend
env =
    USE_MAILPIT=true
    SMTP_HOST=localhost
    SMTP_PORT=1025
    ENVIRONMENT=test

markers =
    infra: mark a test as an infrastructure/smoke test
    e2e: mark a test as an end-to-end user journey test