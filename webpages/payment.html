<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recycling Dashboard & Payments</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">

    <!-- Top Navigation -->
    <nav class="bg-slate-800/80 backdrop-blur-md border-b border-slate-700/50 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center text-emerald-400">
                    <i class="fa-solid fa-recycle text-xl"></i>
                </div>
                <span class="font-bold text-lg text-white">EcoPay Portal</span>
            </div>
            <div id="userInfo" class="text-sm text-slate-400">Loading profile...</div>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- Tab Controls -->
        <div class="flex border-b border-slate-700/60 mb-8 space-x-6">
            <button id="tabPendingBtn" onclick="switchTab('pending')" class="pb-3 text-sm font-semibold border-b-2 border-emerald-400 text-emerald-400 flex items-center gap-2 transition">
                <i class="fa-solid fa-clock"></i> Pending Requests
            </button>
            <button id="tabReviewedBtn" onclick="switchTab('reviewed')" class="pb-3 text-sm font-semibold border-b-2 border-transparent text-slate-400 hover:text-slate-200 flex items-center gap-2 transition">
                <i class="fa-solid fa-square-check"></i> Reviewed Requests
            </button>
        </div>

        <!-- Section 1: Pending Requests -->
        <section id="view-pending" class="space-y-6">
            <div class="bg-slate-800/60 border border-slate-700/60 rounded-2xl p-6 backdrop-blur-xl shadow-xl">
                <h2 class="text-lg font-bold text-white mb-4">Pending Waste Log Submissions</h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead>
                            <tr class="text-slate-400 border-b border-slate-700/60 text-xs uppercase tracking-wider">
                                <th class="pb-3 px-4">Entry ID</th>
                                <th class="pb-3 px-4">Category</th>
                                <th class="pb-3 px-4">Weight (kg)</th>
                                <th class="pb-3 px-4">Estimated Amount</th>
                                <th class="pb-3 px-4">Status</th>
                                <th class="pb-3 px-4 text-right">Action</th>
                            </tr>
                        </thead>
                        <tbody id="pendingTableBody">
                            <tr>
                                <td colspan="6" class="py-6 text-center text-slate-500">Loading pending entries...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

        <!-- Section 2: Reviewed Requests -->
        <section id="view-reviewed" class="space-y-6 hidden">
            <div class="bg-slate-800/60 border border-slate-700/60 rounded-2xl p-6 backdrop-blur-xl shadow-xl">
                <h2 class="text-lg font-bold text-white mb-4">Reviewed History</h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead>
                            <tr class="text-slate-400 border-b border-slate-700/60 text-xs uppercase tracking-wider">
                                <th class="pb-3 px-4">Entry ID</th>
                                <th class="pb-3 px-4">Category</th>
                                <th class="pb-3 px-4">Weight (kg)</th>
                                <th class="pb-3 px-4">Amount</th>
                                <th class="pb-3 px-4">Status</th>
                                <th class="pb-3 px-4 text-right">Record</th> <!-- Updated Column Header -->
                            </tr>
                        </thead>
                        <tbody id="reviewedTableBody">
                            <tr>
                                <td colspan="6" class="py-6 text-center text-slate-500">Loading reviewed history...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

    </main>

    <!-- JS Script Connection -->
    <script src="static/js/master_payment.js"></script>
</body>
</html>
