<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoRecycle - Staff Dashboard</title>
    
    <!-- Inline SVG Favicon to eliminate 404 warnings -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>♻️</text></svg>">
    
    <!-- Compiled Tailwind CSS v4 Stylesheet -->
    <link rel="stylesheet" href="/static/css/output.css">
    
    <!-- FontAwesome & Custom Web Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }
        .accordion-content {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .accordion-content.hidden {
            display: none;
        }
    </style>
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans antialiased">

    <!-- Top Navigation Header -->
    <header class="bg-slate-900 border-b border-slate-800/80 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-amber-400 font-bold text-xl shadow-lg shadow-amber-500/5">
                    <i class="fa-solid fa-building-user"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg tracking-tight text-white flex items-center gap-2">
                        District Control Console
                    </h1>
                    <p class="text-xs text-slate-400">
                        Assigned Officer: <span id="officerEmail" class="text-slate-200 font-medium">nkeerthiganesh@gmail.com</span> 
                        <span class="mx-1 text-slate-600">|</span> 
                        District Zone Prefix: <span id="districtZonePrefix" class="text-amber-400 font-semibold font-mono">64109</span> 
                        <span class="text-slate-400 text-[11px]">(District Prefix: <span id="districtPrefix" class="font-mono">641</span>)</span>
                    </p>
                </div>
            </div>

            <button onclick="logoutStaff()" class="flex items-center gap-2 px-3.5 py-2 rounded-xl text-rose-400 hover:bg-rose-500/10 border border-rose-500/20 hover:border-rose-500/40 transition text-xs font-semibold">
                <i class="fa-solid fa-right-from-bracket"></i>
                <span>Log Out</span>
            </button>
        </div>
    </header>

    <!-- Main Workspace Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">

        <!-- Search & Filter Bar Section -->
        <section class="bg-slate-900/60 border border-slate-800/80 rounded-2xl p-4 sm:p-5 backdrop-blur-xl shadow-xl">
            <form id="filterForm" onsubmit="handleFilterSubmit(event)" class="grid grid-cols-1 md:grid-cols-12 gap-4 items-center">
                
                <!-- Search Name / Email -->
                <div class="md:col-span-4 space-y-1.5">
                    <label for="searchInput" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider">Search Household / Email</label>
                    <div class="relative">
                        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
                        <input type="text" id="searchInput" placeholder="Name or email address..." class="w-full bg-slate-950/80 border border-slate-800 rounded-xl pl-10 pr-4 py-2.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-amber-500/50 focus:ring-1 focus:ring-amber-500/50 transition">
                    </div>
                </div>

                <!-- Exact PIN Search -->
                <div class="md:col-span-4 space-y-1.5">
                    <label for="pincodeInput" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider">Filter by Exact PIN Code</label>
                    <div class="relative">
                        <i class="fa-solid fa-location-dot absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
                        <input type="text" id="pincodeInput" placeholder="e.g. 641001" class="w-full bg-slate-950/80 border border-slate-800 rounded-xl pl-10 pr-4 py-2.5 text-sm text-slate-100 placeholder-slate-500 font-mono focus:outline-none focus:border-amber-500/50 focus:ring-1 focus:ring-amber-500/50 transition">
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="md:col-span-4 flex items-end gap-3 pt-2 md:pt-0">
                    <button type="submit" class="flex-1 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-2.5 px-4 rounded-xl shadow-lg shadow-amber-500/10 hover:shadow-amber-500/20 transition flex items-center justify-center gap-2 text-sm">
                        <i class="fa-solid fa-filter text-xs"></i>
                        <span>Apply Filters</span>
                    </button>

                    <button type="button" onclick="resetFilters()" class="px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700/60 hover:border-slate-600 transition text-sm font-semibold">
                        Reset
                    </button>
                </div>
            </form>
        </section>

        <!-- District Household Profiles Table Workspace -->
        <section class="bg-slate-900/60 border border-slate-800/80 rounded-2xl shadow-xl overflow-hidden backdrop-blur-xl">
            
            <!-- Table Sub-Header -->
            <div class="px-6 py-4 border-b border-slate-800/80 flex items-center justify-between">
                <div class="flex items-center gap-2.5">
                    <i class="fa-solid fa-users text-amber-400 text-lg"></i>
                    <h2 class="font-bold text-base text-white">District Household Profiles</h2>
                </div>
                <span id="profilesCountBadge" class="bg-amber-500/10 border border-amber-500/30 text-amber-400 font-bold px-3 py-1 rounded-full text-xs font-mono">
                    0 found
                </span>
            </div>

            <!-- Profiles Master Table -->
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm border-collapse">
                    <thead>
                        <tr class="bg-slate-950/40 text-slate-400 border-b border-slate-800/80 text-xs uppercase tracking-wider">
                            <th class="py-3.5 px-6 font-semibold">ID</th>
                            <th class="py-3.5 px-6 font-semibold">Full Name</th>
                            <th class="py-3.5 px-6 font-semibold">Email</th>
                            <th class="py-3.5 px-6 font-semibold">Pin Code</th>
                            <th class="py-3.5 px-6 font-semibold">Premise</th>
                            <th class="py-3.5 px-6 font-semibold">UPI ID</th>
                            <th class="py-3.5 px-6 font-semibold text-right">Pending Requests</th>
                        </tr>
                    </thead>
                    <tbody id="householdProfilesTbody" class="divide-y divide-slate-800/50">
                        <tr>
                            <td colspan="7" class="py-12 text-center text-slate-500">
                                <i class="fa-solid fa-circle-notch fa-spin text-2xl mb-2 text-amber-500"></i>
                                <p class="text-xs font-medium">Fetching registered district profiles...</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- External Script Link -->
    <script src="/static/js/staff_dashboard.js"></script>
</body>
</html>
