<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoRecycle - District Staff Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6">

    <div class="max-w-6xl mx-auto space-y-6">
        
        <!-- Header Controls -->
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-slate-900 border border-slate-800 p-6 rounded-2xl">
            <div>
                <h1 class="text-2xl font-extrabold text-white flex items-center gap-2">
                    <i class="fa-solid fa-building-user text-amber-400"></i> District Control Console
                </h1>
                <p class="text-xs text-slate-400 mt-1">
                    Assigned Officer: <span id="staffEmailDisplay" class="text-slate-200 font-semibold">---</span> | 
                    District Zone Prefix: <span id="districtZoneDisplay" class="text-amber-400 font-bold">---</span>
                </p>
            </div>
            <button id="logoutBtn" class="bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/30 font-semibold px-4 py-2 rounded-xl text-xs transition self-start md:self-auto">
                <i class="fa-solid fa-right-from-bracket"></i> Log Out
            </button>
        </div>

        <!-- Search & Filter Controls -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 bg-slate-900/60 border border-slate-800/80 p-4 rounded-2xl">
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Search Household / Email</label>
                <input type="text" id="searchInput" placeholder="Name or email address..." class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-amber-500">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Filter by Exact PIN Code</label>
                <input type="text" id="pinInput" placeholder="e.g. 641001" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-amber-500">
            </div>
            <div class="flex items-end gap-2">
                <button id="filterBtn" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-2 px-4 rounded-xl text-xs transition">
                    <i class="fa-solid fa-filter"></i> Apply Filters
                </button>
                <button id="resetBtn" class="bg-slate-800 hover:bg-slate-700 text-slate-300 py-2 px-4 rounded-xl text-xs transition">
                    Reset
                </button>
            </div>
        </div>

        <!-- Household Records Table -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl">
            <div class="p-4 border-b border-slate-800 flex justify-between items-center">
                <h3 class="text-sm font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-users text-amber-400"></i> District Household Profiles
                </h3>
                <span id="recordCount" class="text-xs font-semibold bg-amber-500/10 text-amber-400 border border-amber-500/20 px-2.5 py-1 rounded-full">0 found</span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs text-slate-300">
                    <thead class="bg-slate-800/60 text-slate-400 uppercase tracking-wider border-b border-slate-800">
                        <tr>
                            <th class="p-3">ID</th>
                            <th class="p-3">Full Name</th>
                            <th class="p-3">Email</th>
                            <th class="p-3">PIN Code</th>
                            <th class="p-3">Premise</th>
                            <th class="p-3">UPI ID</th>
                            <th class="p-3 text-right">Action</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody" class="divide-y divide-slate-800/50">
                        <!-- Dynamic User Rows -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script src="/static/js/staff_dashboard.js"></script>
</body>
</html>
