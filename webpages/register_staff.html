<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoRecycle - Staff Registration</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>♻️</text></svg>">
    <link rel="stylesheet" href="/static/css/output.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-8">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-emerald-500/10 text-emerald-400 mb-4">
                <i class="fa-solid fa-user-shield text-2xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-white">Staff Registration</h1>
            <p class="text-slate-400 text-sm mt-1">Create a district officer account</p>
        </div>

        <form id="staffRegisterForm" class="space-y-4">
            <div>
                <label for="fullName" class="block text-sm font-medium text-slate-300 mb-1">Full Name</label>
                <input type="text" id="fullName" required placeholder="Officer Name"
                       class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-emerald-500 transition">
            </div>

            <div>
                <label for="email" class="block text-sm font-medium text-slate-300 mb-1">Official Email Address</label>
                <input type="email" id="email" required placeholder="officer@ecorecycle.gov"
                       class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-emerald-500 transition">
            </div>

            <div>
                <label for="assignedPincode" class="block text-sm font-medium text-slate-300 mb-1">Assigned Postal / PIN Code</label>
                <input type="text" id="assignedPincode" required placeholder="641001" maxlength="6"
                       class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-emerald-500 transition">
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-slate-300 mb-1">Password</label>
                <input type="password" id="password" required placeholder="••••••••"
                       class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-emerald-500 transition">
            </div>

            <button type="submit" id="submitBtn"
                    class="w-full bg-emerald-500 hover:bg-emerald-600 disabled:bg-slate-700 text-slate-900 font-bold py-3 rounded-lg transition shadow-lg shadow-emerald-500/20">
                Send Authorization Code
            </button>
        </form>

        <div class="mt-6 text-center text-sm text-slate-400">
            Already registered? <a href="/staff-login" class="text-emerald-400 hover:underline">Log in here</a>
        </div>
    </div>

    <script src="/static/js/register_staff.js"></script>
</body>
</html>
