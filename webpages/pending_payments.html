<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoRecycle - Pending Queue</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap'); body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex">
    <!-- Sidebar -->
    <aside class="w-72 bg-slate-800/50 border-r border-slate-700/60 p-6 flex flex-col justify-between hidden md:flex">
        <div>
            <div class="flex items-center gap-3 mb-10 px-2">
                <div class="w-10 h-10 rounded-xl bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center text-emerald-400 font-bold text-xl"><i class="fa-solid fa-leaf"></i></div>
                <span class="font-bold text-lg text-white">EcoRecycle</span>
            </div>
            <nav class="space-y-2">
                <a href="/payment" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-slate-400 hover:bg-slate-800 transition text-sm font-medium"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
                <a href="/register-payment" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-slate-400 hover:bg-slate-800 transition text-sm font-medium"><i class="fa-solid fa-circle-plus"></i> Register Payment</a>
                <a href="/pending-payments" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl bg-emerald-500/10 text-emerald-400 font-medium text-sm border border-emerald-500/20"><i class="fa-solid fa-clock-rotate-left"></i> Pending Queue</a>
                <a href="/payment-info" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-slate-400 hover:bg-slate-800 transition text-sm font-medium"><i class="fa-solid fa-circle-info"></i> PAYT Info Guide</a>
            </nav>
        </div>
    </aside>

    <!-- Content -->
    <main class="flex-1 p-6 md:p-10 overflow-y-auto">
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-8">
            <div>
                <h1 class="text-2xl md:text-3xl font-bold text-white">Pending Transaction Queue</h1>
                <p class="text-slate-400 text-sm mt-1">Live record stream for submitted recycling entries.</p>
            </div>
            <div class="bg-slate-800/80 border border-slate-700/80 rounded-xl px-5 py-3 flex items-center gap-4 shadow-sm">
                <span class="text-xs text-slate-400 font-medium uppercase tracking-wider">Total Pending Payout</span>
                <span id="totalPendingAmount" class="text-xl font-bold text-emerald-400 font-mono">₹0.00</span>
            </div>
        </header>

        <!-- Queue Table Container -->
        <div class="bg-slate-800/60 border border-slate-700/80 rounded-2xl overflow-hidden shadow-lg">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-800 text-slate-400 text-xs uppercase tracking-wider border-b border-slate-700/80">
                            <th class="p-4">Entry ID</th>
                            <th class="p-4">Waste Category</th>
                            <th class="p-4">Weight (kg)</th>
                            <th class="p-4">Payout Amount</th>
                            <th class="p-4">Timestamp</th>
                        </tr>
                    </thead>
                    <tbody id="pendingPaymentsTableBody" class="divide-y divide-slate-700/50 text-sm">
                        <!-- Loaded dynamically via pending_payments.js -->
                        <tr>
                            <td colspan="5" class="text-center py-6 text-slate-400">
                                <i class="fa-solid fa-spinner fa-spin mr-2"></i> Fetching live recycling entries...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- New JS Reference -->
    <script src="/static/js/pending_payments.js"></script>
</body>
</html>
