<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoRecycle - Reviewed Requests</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex">

    <!-- Sidebar -->
    <aside class="w-72 bg-slate-800/50 border-r border-slate-700/60 p-6 flex flex-col justify-between hidden md:flex">
        <div>
            <div class="flex items-center gap-3 mb-10 px-2">
                <div class="w-10 h-10 rounded-xl bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center text-emerald-400 font-bold text-xl">
                    <i class="fa-solid fa-leaf"></i>
                </div>
                <span class="font-bold text-lg tracking-wide text-white">EcoRecycle</span>
            </div>

            <nav class="space-y-1.5">
                <a href="/payment" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-slate-400 hover:text-slate-200 hover:bg-slate-800/60 transition text-sm font-medium">
                    <i class="fa-solid fa-wallet text-base"></i> Payment Options
                </a>
                <a href="/pending-payments" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-slate-400 hover:text-slate-200 hover:bg-slate-800/60 transition text-sm font-medium">
                    <i class="fa-solid fa-clock-rotate-left text-base"></i> Pending Queue
                </a>
                <a href="/reviewed-requests" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl bg-emerald-500/10 text-emerald-400 font-medium text-sm border border-emerald-500/20">
                    <i class="fa-solid fa-clipboard-check text-base"></i> Reviewed Requests
                </a>
                <a href="/payment-info" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-slate-400 hover:text-slate-200 hover:bg-slate-800/60 transition text-sm font-medium">
                    <i class="fa-solid fa-circle-info text-base"></i> Payment Info Guide
                </a>
            </nav>
        </div>

        <button onclick="localStorage.clear(); sessionStorage.clear(); window.location.href='/login';" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-rose-400 hover:bg-rose-500/10 transition text-sm font-medium w-full">
            <i class="fa-solid fa-right-from-bracket"></i> Sign Out
        </button>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-6 md:p-10 overflow-y-auto">
        <header class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8 border-b border-slate-800 pb-6">
            <div>
                <h1 class="text-2xl md:text-3xl font-bold text-white tracking-tight">Reviewed Requests</h1>
                <p class="text-slate-400 text-sm mt-1">Track approved credits and declined payouts.</p>
            </div>
            <div class="bg-slate-800 border border-slate-700/60 px-4 py-2 rounded-xl">
                <span class="text-xs text-slate-400">Approved Earnings:</span>
                <span id="approvedTotalDisplay" class="font-bold text-emerald-400 ml-2">₹0.00</span>
            </div>
        </header>

        <!-- Table Container -->
        <div class="bg-slate-800/40 border border-slate-700/60 rounded-2xl p-6 shadow-xl">
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead>
                        <tr class="text-slate-400 border-b border-slate-700/60 text-xs uppercase tracking-wider">
                            <th class="pb-3 px-4">Entry ID</th>
                            <th class="pb-3 px-4">Waste Category</th>
                            <th class="pb-3 px-4">Weight (kg)</th>
                            <th class="pb-3 px-4">Payout Amount</th>
                            <th class="pb-3 px-4">Status</th>
                            <th class="pb-3 px-4 text-right">Details</th>
                        </tr>
                    </thead>
                    <tbody id="reviewedTableBody">
                        <tr>
                            <td colspan="6" class="py-8 text-center text-slate-500">Loading reviewed items...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="/static/js/reviewed_requests.js"></script>
</body>
</html>
