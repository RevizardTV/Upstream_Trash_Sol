<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoRecycle - Complete Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap'); body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-6">
    <div class="max-w-xl w-full bg-slate-800/60 border border-slate-700/80 rounded-2xl p-8 shadow-xl">
        <div class="flex items-center gap-3 mb-6">
            <div class="w-10 h-10 rounded-xl bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center text-emerald-400 font-bold text-xl"><i class="fa-solid fa-user-gear"></i></div>
            <div>
                <h1 class="text-xl font-bold text-white">Complete Your Profile</h1>
                <p class="text-slate-400 text-xs">Link your email, address, and payout account.</p>
            </div>
        </div>

        <form id="profileRegisterForm" class="space-y-4">
            <!-- Email Address (Linked to OTP) -->
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Email Address (OTP Verified)</label>
                <div class="relative">
                    <input type="email" id="email" required placeholder="name@example.com" class="w-full bg-slate-900 border border-slate-700 rounded-xl pl-10 pr-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-emerald-500">
                    <i class="fa-solid fa-envelope absolute left-3.5 top-3 text-slate-500 text-xs"></i>
                </div>
            </div>

            <!-- Full Name & Phone -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Full Name</label>
                    <input type="text" id="fullName" required placeholder="Alex Morgan" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Phone Number</label>
                    <input type="tel" id="phoneNumber" required placeholder="+91 98765 43210" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-emerald-500">
                </div>
            </div>

            <!-- Location Details -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">City / Ward</label>
                    <input type="text" id="city" required placeholder="Coimbatore" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">PIN / Zip Code</label>
                    <input type="text" id="postalCode" required placeholder="641001" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-emerald-500">
                </div>
            </div>

            <!-- Premise Type & Household Size -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Premise Type</label>
                    <select id="premiseType" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-emerald-500">
                        <option value="house">Single Family House</option>
                        <option value="apartment">Apartment / Flat</option>
                        <option value="commercial">Commercial Business</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Household Size</label>
                    <input type="number" id="householdSize" min="1" value="1" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-emerald-500">
                </div>
            </div>

            <!-- UPI Payment ID -->
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Payout Method (UPI ID)</label>
                <input type="text" id="upiId" placeholder="alex@okicici" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-emerald-500">
            </div>

            <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-3 rounded-xl transition mt-4 text-sm flex items-center justify-center gap-2">
                <i class="fa-solid fa-check"></i> Save & Continue to Dashboard
            </button>
        </form>
    </div>

    <!-- Auto-fill Email Script -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const savedEmail = urlParams.get("email") || sessionStorage.getItem("verified_email");
            if (savedEmail) {
                document.getElementById("email").value = savedEmail;
            }
        });
    </script>
</body>
</html>
