<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoRecycle - Register Payment</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap'); body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex">
    <!-- Sidebar -->
    <aside class="w-72 bg-slate-800/50 border-r border-slate-700/60 p-6 flex flex-col justify-between hidden md:flex">
        <div>
            <div class="flex items-center gap-3 mb-10 px-2">
                <div class="w-10 h-10 rounded-xl bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center text-emerald-400 font-bold text-xl"><i class="fa-solid fa-leaf"></i></div>
                <span class="font-bold text-lg text-white">EcoRecycle</span>
            </div>
            <nav class="space-y-2">
                <a href="/payment" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-slate-400 hover:bg-slate-800 transition text-sm font-medium"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
                <a href="/register-payment" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl bg-emerald-500/10 text-emerald-400 font-medium text-sm border border-emerald-500/20"><i class="fa-solid fa-circle-plus"></i> Register Payment</a>
                <a href="/pending-payments" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-slate-400 hover:bg-slate-800 transition text-sm font-medium"><i class="fa-solid fa-clock-rotate-left"></i> Pending Queue</a>
                <a href="/payment-info" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-slate-400 hover:bg-slate-800 transition text-sm font-medium"><i class="fa-solid fa-circle-info"></i> PAYT Info Guide</a>
            </nav>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-6 md:p-10 overflow-y-auto">
        <header class="mb-8">
            <h1 class="text-2xl md:text-3xl font-bold text-white">Register New Waste Drop-Off</h1>
            <p class="text-slate-400 text-sm mt-1">Log recycling volume to generate payout or record PAYT fees.</p>
        </header>

        <form id="paymentRegisterForm" class="max-w-3xl bg-slate-800/60 border border-slate-700/80 rounded-2xl p-6 md:p-8 space-y-6">
            <!-- Waste Category Selector -->
            <div>
                <label class="block text-sm font-semibold text-slate-200 mb-3">1. Select Waste Category</label>
                <div class="grid grid-cols-2 sm:grid-cols-5 gap-3">
                    <!-- Plastic -->
                    <label class="cursor-pointer border border-slate-700 rounded-xl p-3 flex flex-col items-center justify-center gap-2 hover:border-emerald-500/50 bg-slate-800/40 has-[:checked]:border-emerald-500 has-[:checked]:bg-emerald-500/10">
                        <input type="radio" name="material" value="plastic" data-rate="0.35" data-type="payout" class="sr-only" checked>
                        <i class="fa-solid fa-bottle-water text-emerald-400 text-xl"></i>
                        <span class="text-xs font-semibold">Plastic ($0.35/kg)</span>
                        <button type="button" onclick="showTip('plastic')" class="text-slate-400 hover:text-white text-xs mt-1"><i class="fa-solid fa-circle-info"></i> Info</button>
                    </label>

                    <!-- Metal (Fixed Icon) -->
                    <label class="cursor-pointer border border-slate-700 rounded-xl p-3 flex flex-col items-center justify-center gap-2 hover:border-emerald-500/50 bg-slate-800/40 has-[:checked]:border-emerald-500 has-[:checked]:bg-emerald-500/10">
                        <input type="radio" name="material" value="metal" data-rate="0.80" data-type="payout" class="sr-only">
                        <i class="fa-solid fa-layer-group text-amber-400 text-xl"></i>
                        <span class="text-xs font-semibold">Metal ($0.80/kg)</span>
                        <button type="button" onclick="showTip('metal')" class="text-slate-400 hover:text-white text-xs mt-1"><i class="fa-solid fa-circle-info"></i> Info</button>
                    </label>

                    <!-- Paper -->
                    <label class="cursor-pointer border border-slate-700 rounded-xl p-3 flex flex-col items-center justify-center gap-2 hover:border-emerald-500/50 bg-slate-800/40 has-[:checked]:border-emerald-500 has-[:checked]:bg-emerald-500/10">
                        <input type="radio" name="material" value="paper" data-rate="0.15" data-type="payout" class="sr-only">
                        <i class="fa-solid fa-box text-sky-400 text-xl"></i>
                        <span class="text-xs font-semibold">Paper ($0.15/kg)</span>
                        <button type="button" onclick="showTip('paper')" class="text-slate-400 hover:text-white text-xs mt-1"><i class="fa-solid fa-circle-info"></i> Info</button>
                    </label>

                    <!-- E-Waste -->
                    <label class="cursor-pointer border border-slate-700 rounded-xl p-3 flex flex-col items-center justify-center gap-2 hover:border-emerald-500/50 bg-slate-800/40 has-[:checked]:border-emerald-500 has-[:checked]:bg-emerald-500/10">
                        <input type="radio" name="material" value="ewaste" data-rate="1.50" data-type="payout" class="sr-only">
                        <i class="fa-solid fa-plug text-purple-400 text-xl"></i>
                        <span class="text-xs font-semibold">E-Waste ($1.50/kg)</span>
                        <button type="button" onclick="showTip('ewaste')" class="text-slate-400 hover:text-white text-xs mt-1"><i class="fa-solid fa-circle-info"></i> Info</button>
                    </label>

                    <!-- Landfill (Added Category) -->
                    <label class="cursor-pointer border border-slate-700 rounded-xl p-3 flex flex-col items-center justify-center gap-2 hover:border-rose-500/50 bg-slate-800/40 has-[:checked]:border-rose-500 has-[:checked]:bg-rose-500/10">
                        <input type="radio" name="material" value="landfill" data-rate="-0.25" data-type="charge" class="sr-only">
                        <i class="fa-solid fa-trash-can text-rose-400 text-xl"></i>
                        <span class="text-xs font-semibold">Landfill (-$0.25/kg)</span>
                        <button type="button" onclick="showTip('landfill')" class="text-slate-400 hover:text-white text-xs mt-1"><i class="fa-solid fa-circle-info"></i> Info</button>
                    </label>
                </div>
            </div>

            <!-- Estimated Calculation Output -->
            <div class="bg-slate-900 border border-slate-700 p-4 rounded-xl flex justify-between items-center">
                <span class="text-sm font-semibold text-slate-300">Estimated Transaction Total:</span>
                <span id="estimatedTotal" class="text-lg font-bold text-emerald-400">$0.00 (Payout)</span>
            </div>

            <!-- Dynamic Optimization Info Panel -->
            <div id="infoPanel" class="hidden bg-slate-800 border border-emerald-500/40 p-4 rounded-xl text-xs text-slate-300">
                <div class="flex justify-between font-bold text-white mb-1">
                    <span id="infoTitle">Waste Optimization Tip</span>
                    <button type="button" onclick="document.getElementById('infoPanel').classList.add('hidden')" class="hover:text-white">✕</button>
                </div>
                <p id="infoContent"></p>
            </div>

            <!-- Station and Weight Inputs -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-200 mb-2">Station / Bin ID</label>
                    <input id="stationInput" type="text" placeholder="e.g. BIN-COIMBATORE-08" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-slate-200 focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-200 mb-2">Measured Weight (kg)</label>
                    <input id="weightInput" type="number" step="0.1" placeholder="0.0" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-slate-200 focus:outline-none focus:border-emerald-500" required>
                </div>
            </div>

            <!-- Payment Account Selector -->
            <div>
                <label class="block text-sm font-semibold text-slate-200 mb-2">Select Target Account</label>
                <select class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-slate-200 focus:outline-none focus:border-emerald-500">
                    <option value="upi">UPI ID (alex@okicici)</option>
                    <option value="bank">HDFC Direct Deposit (*4920)</option>
                    <option value="wallet">EcoRecycle Internal Wallet</option>
                </select>
            </div>

            <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-3.5 rounded-xl transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-paper-plane"></i> Submit Drop-off Entry
            </button>
        </form>
    </main>

    <!-- Static Script Inclusion -->
    <script src="/static/register_payment.js"></script>
</body>
</html>
