<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Home - EcoRecycle Portal</title>
  <link rel="stylesheet" href="/static/css/styles.css" />
</head>
<body>
  <nav>
    <a href="/" class="logo">♻️ EcoRecycle Portal</a>
    <div class="nav-links">
      <a href="/" class="active">Home</a>
      <a href="/login">Login</a>
      <a href="/payment">Payment View</a>
    </div>
  </nav>

  <main>
    <div class="card">
      <h1>Schedule Waste Pickup</h1>
      <p class="subtitle">Request household dry waste or e-waste collection.</p>
      <form id="pickup-form">
        <div class="form-group">
          <label for="waste-type">Waste Category</label>
          <select id="waste-type" required>
            <option value="Plastic/Paper">Plastic & Cardboard</option>
            <option value="E-Waste">E-Waste / Electronics</option>
            <option value="Metal">Scrap Metal</option>
          </select>
        </div>
        <div class="form-group">
          <label for="weight">Estimated Weight (kg)</label>
          <input type="number" id="weight" min="1" placeholder="e.g. 10" required />
        </div>
        <div class="form-group">
          <label for="address">Pickup Address</label>
          <input type="text" id="address" placeholder="e.g. Peelamedu, Coimbatore" required />
        </div>
        <button type="submit" class="btn">Proceed to Estimate</button>
      </form>
    </div>
  </main>

  <script src="/static/js/home.js"></script>
</body>
</html>
