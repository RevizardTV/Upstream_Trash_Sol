<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Payment View - EcoRecycle Portal</title>
  <link rel="stylesheet" href="/static/css/styles.css" />
</head>
<body>
  <nav>
    <a href="/" class="logo">♻️ EcoRecycle Portal</a>
    <div class="nav-links">
      <a href="/">Home</a>
      <a href="/login">Login</a>
      <a href="/payment" class="active">Payment View</a>
    </div>
  </nav>

  <main>
    <div class="card">
      <span class="status-badge">Payment Scheduled</span>
      <h2>Payout Receipt</h2>
      <p class="subtitle">Summary of your current dry waste valuation.</p>
      
      <div class="receipt-details">
        <div class="receipt-row">
          <span>Selected Category:</span>
          <strong id="summary-category">E-Waste</strong>
        </div>
        <div class="receipt-row">
          <span>Estimated Weight:</span>
          <strong id="summary-weight">10 kg</strong>
        </div>
        <div class="receipt-row">
          <span>Rate per kg:</span>
          <span>₹15 / kg</span>
        </div>
        <div class="receipt-row total">
          <span>Estimated Payout:</span>
          <span id="summary-total">₹150</span>
        </div>
      </div>

      <button id="confirm-btn" class="btn">Confirm Request</button>
    </div>
  </main>

  <script src="/static/js/payment.js"></script>
</body>
</html>
